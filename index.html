<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e7" />
    <title>Language Lab</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Language Lab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f1e7;
        color: #222;
        font-family: system-ui, sans-serif;
      }
      #app {
        max-width: 520px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }
      button {
        font: inherit;
        font-size: 20px;
        padding: 14px;
        border: 2px solid #222;
        border-radius: 14px;
        background: #fff;
        color: #222;
        touch-action: manipulation;
      }
      .remaining {
        margin: 0;
        opacity: 0.6;
      }
      .front {
        font-size: 120px;
        line-height: 1.2;
        margin: 24px 0 8px;
      }
      .back {
        font-size: 28px;
        padding: 16px;
        border-top: 2px dashed #bbb;
      }
      .front.sentence {
        font-size: 40px;
      }
      .back.sentence {
        font-size: 36px;
      }
      .prompt,
      .meaning,
      .new-item {
        font-size: 22px;
        margin: 4px 0;
      }
      mark {
        background: #ffe58a;
        border-radius: 4px;
        padding: 0 2px;
      }
      .grades {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .grade {
        min-height: 96px;
        font-size: 28px;
        font-weight: bold;
      }
      .grade.again {
        background: #f7c6c0;
      }
      .grade.good {
        background: #c4e6bf;
      }
      #nav {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        right: 8px;
        display: flex;
        gap: 6px;
      }
      #nav button {
        font-size: 16px;
        padding: 8px 12px;
        border-width: 1px;
      }
      .settings-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
        text-align: left;
      }
      .settings-section label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .settings-section input {
        font: inherit;
        font-size: 18px;
        padding: 10px;
        border: 1px solid #888;
        border-radius: 10px;
      }
      .hint,
      .sync-status {
        margin: 0;
        opacity: 0.7;
      }
      .done {
        margin-top: 40vh;
        font-size: 24px;
      }
      .waiting {
        margin-top: 35vh;
      }
      .waiting-time {
        font-size: 24px;
        margin: 0 0 8px;
      }
      .romanisation {
        font-size: 20px;
        margin: 0;
        opacity: 0.6;
        font-style: italic;
      }
      .grammar-note {
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: left;
      }
      .grammar-note .note-heading {
        margin: 0;
        font-size: 16px;
        opacity: 0.6;
      }
      .grammar-note .note-pattern {
        margin: 0;
        font-size: 40px;
        text-align: center;
      }
      .grammar-note .note-meaning {
        margin: 0;
        font-size: 20px;
        text-align: center;
      }
      .grammar-note .note-text,
      .grammar-note .note-example {
        margin: 0;
        font-size: 20px;
        line-height: 1.4;
      }
      .grammar-note .note-example {
        padding: 12px;
        background: #fff;
        border-radius: 10px;
      }
      .grammar-note-overlay {
        position: fixed;
        inset: 0;
        background: #f6f1e7;
        overflow-y: auto;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      .grammar-note-overlay .grammar-note {
        max-width: 520px;
        margin: 0 auto;
      }
      .open-note {
        font-size: 16px;
        padding: 8px 12px;
        border-width: 1px;
      }
      /* Progress and "How Review works" (ticket 10). */
      .page-title {
        margin: 40px 0 0;
      }
      .stat,
      .method,
      .steps {
        text-align: left;
      }
      .stat-label {
        opacity: 0.7;
      }
      .stat-value {
        font-size: 32px;
        font-weight: bold;
      }
      .stat progress {
        width: 100%;
        height: 12px;
      }
      .steps li {
        margin-bottom: 10px;
        font-size: 18px;
      }
      .method h3 {
        margin: 12px 0 4px;
      }
      .method p {
        margin: 2px 0;
      }
      .tier {
        font-size: 14px;
        font-weight: normal;
        padding: 2px 6px;
        border-radius: 6px;
        background: #c4e6bf;
      }
      .tier.promising {
        background: #ffe58a;
      }
      .citation {
        font-size: 14px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <nav id="nav">
      <button id="open-progress" type="button">Progress</button>
      <button id="open-settings" type="button">Settings</button>
    </nav>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
