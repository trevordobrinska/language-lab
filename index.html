<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e7" />
    <title>Language Lab</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f1e7;
        color: #222;
        font-family: system-ui, sans-serif;
      }
      #app {
        max-width: 520px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 16px;
        text-align: center;
      }
      button {
        font: inherit;
        font-size: 20px;
        padding: 14px;
        border: 2px solid #222;
        border-radius: 14px;
        background: #fff;
        color: #222;
        touch-action: manipulation;
      }
      .remaining {
        margin: 0;
        opacity: 0.6;
      }
      .front {
        font-size: 120px;
        line-height: 1.2;
        margin: 24px 0 8px;
      }
      .back {
        font-size: 28px;
        padding: 16px;
        border-top: 2px dashed #bbb;
      }
      .grades {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .grade {
        min-height: 96px;
        font-size: 28px;
        font-weight: bold;
      }
      .grade.again {
        background: #f7c6c0;
      }
      .grade.good {
        background: #c4e6bf;
      }
      .done {
        margin-top: 40vh;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
